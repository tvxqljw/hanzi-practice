<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汉字练习 - 响应式版</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
</head>
<body>

    <h1>汉字笔顺练习</h1>

    <div class="input-group">
        <input type="text" id="chars-input" placeholder="输入汉字..." value="瑞雪兆丰年">
        <button onclick="renderAll()">生成练习</button>
    </div>

    <div id="writer-container"></div>

    <div class="controls">
        <button onclick="animateAll()">顺序播放</button>
        <button id="reset-btn" onclick="resetAll()">重置书写</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
